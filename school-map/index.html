<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全国机构分布热力图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #ffffff;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        h1 {
            font-size: 16px;
            font-weight: 600;
            color: #1f2937;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-size: 13px;
            color: #6b7280;
        }
        select {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #f9fafb;
            font-size: 13px;
            outline: none;
        }
        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        /* 移动端专属响应式调整 */
        @media (max-width: 600px) {
            header {
                padding: 10px 12px;
            }
            h1 {
                font-size: 14px;
            }
            select {
                padding: 4px 8px;
                font-size: 12px;
            }
        }
        #loading-mask {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            font-size: 14px;
            color: #4b5563;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>机构分布热力图</h1>
        <div class="controls">
            <label for="colorScheme">配色：</label>
            <select id="colorScheme">
                <option value="red">暖红</option>
                <option value="blue">深蓝</option>
                <option value="green">墨绿</option>
                <option value="purple">紫罗兰</option>
            </select>
        </div>
    </header>

    <div id="map-container">
        <div id="loading-mask">
            <div class="spinner"></div>
            <div id="loading-text">正在加载地图与数据...</div>
        </div>
    </div>

    <script>
        // 固定的数据 URL
        const DATA_URL = 'https://me.yllty.de/school-map/schools.txt';

        // 中国省份/自治区/直辖市名称映射表（支持匹配包含“省/市/自治区”的正则）
        const provinceMap = [
            { name: "北京", pattern: /^北京/ },
            { name: "天津", pattern: /^天津/ },
            { name: "上海", pattern: /^上海/ },
            { name: "重庆", pattern: /^重庆/ },
            { name: "河北", pattern: /^河北/ },
            { name: "山西", pattern: /^山西/ },
            { name: "辽宁", pattern: /^辽宁/ },
            { name: "吉林", pattern: /^吉林/ },
            { name: "黑龙江", pattern: /^黑龙江/ },
            { name: "江苏", pattern: /^江苏/ },
            { name: "浙江", pattern: /^浙江/ },
            { name: "安徽", pattern: /^安徽/ },
            { name: "福建", pattern: /^福建/ },
            { name: "江西", pattern: /^江西/ },
            { name: "山东", pattern: /^山东/ },
            { name: "河南", pattern: /^河南/ },
            { name: "湖北", pattern: /^湖北/ },
            { name: "湖南", pattern: /^湖南/ },
            { name: "广东", pattern: /^广东/ },
            { name: "海南", pattern: /^海南/ },
            { name: "四川", pattern: /^四川/ },
            { name: "贵州", pattern: /^贵州/ },
            { name: "云南", pattern: /^云南/ },
            { name: "陕西", pattern: /^陕西/ },
            { name: "甘肃", pattern: /^甘肃/ },
            { name: "青海", pattern: /^青海/ },
            { name: "台湾", pattern: /^台湾/ },
            { name: "内蒙古", pattern: /^内蒙古/ },
            { name: "广西", pattern: /^广西/ },
            { name: "西藏", pattern: /^西藏/ },
            { name: "宁夏", pattern: /^宁夏/ },
            { name: "新疆", pattern: /^新疆/ },
            { name: "香港", pattern: /^香港/ },
            { name: "澳门", pattern: /^澳门/ }
        ];

        // 配色方案（从浅至深）
        const colorPalette = {
            red: ['#fef2f2', '#fca5a5', '#ef4444', '#b91c1c', '#7f1d1d'],
            blue: ['#eff6ff', '#93c5fd', '#3b82f6', '#1d4ed8', '#1e3a8a'],
            green: ['#f0fdf4', '#86efac', '#22c55e', '#15803d', '#14532d'],
            purple: ['#faf5ff', '#d8b4fe', '#a855f7', '#6b21a8', '#3b0764']
        };

        const mapContainer = document.getElementById('map-container');
        const loadingMask = document.getElementById('loading-mask');
        const loadingText = document.getElementById('loading-text');
        
        let myChart = echarts.init(mapContainer);
        let cachedParsedData = null;

        // 监听窗体大小变化，适应移动端横竖屏切换
        window.addEventListener('resize', () => myChart.resize());

        // 监听主题颜色切换
        document.getElementById('colorScheme').addEventListener('change', () => {
            if (cachedParsedData) renderMap(cachedParsedData);
        });

        // 主入口流程
        async function start() {
            try {
                // 1. 并行加载地图 GeoJSON 与 TXT 文本数据
                const [geoJson, textData] = await Promise.all([
                    fetchChinaGeoJson(),
                    fetchTxtData()
                ]);

                // 2. 注册 ECharts 地图
                echarts.registerMap('china', geoJson);

                // 3. 解析文本内容并计算省份数量
                cachedParsedData = parseTextData(textData);

                // 4. 渲染地图并隐藏 Loading 遮罩
                renderMap(cachedParsedData);
                loadingMask.style.display = 'none';

            } catch (error) {
                loadingText.style.color = '#ef4444';
                loadingText.innerHTML = `<strong>加载失败</strong><br>${error.message}`;
            }
        }

        // 获取中国地图 GeoJSON（含备用 CDN 回退）
        async function fetchChinaGeoJson() {
            const urls = [
                'https://cdn.jsdelivr.net/gh/apache/echarts-website@asf-site/examples/data/asset/geo/China.json',
                'https://raw.parsecdn.com/china-geojson/main/China.json' // 备用源
            ];

            for (let url of urls) {
                try {
                    const res = await fetch(url);
                    if (res.ok) return await res.json();
                } catch (e) {
                    console.warn(`GeoJSON 加载失败，重试下一个源: ${url}`);
                }
            }
            throw new Error('无法加载地图底图，请检查网络连接。');
        }

        // 获取 TXT 文本数据
        async function fetchTxtData() {
            try {
                const res = await fetch(DATA_URL);
                if (!res.ok) throw new Error(`HTTP 状态码: ${res.status}`);
                return await res.text();
            } catch (e) {
                throw new Error(`无法获取机构文本数据（可能是 CORS 跨域限制或链接失效）。<br>URL: ${DATA_URL}`);
            }
        }

        // 强化后的 TXT 分析逻辑
        function parseTextData(text) {
            const counts = {};
            provinceMap.forEach(item => counts[item.name] = 0);

            // 按行分割
            const lines = text.split(/\r?\n/);

            lines.forEach(line => {
                // 去除首尾空白字符
                const trimmed = line.trim();

                // 规则 1：忽略空行或只包含空白字符的行
                if (!trimmed) return;

                // 规则 2：匹配地名（检查是否以已知省份开头）
                let matched = false;
                for (let prov of provinceMap) {
                    if (prov.pattern.test(trimmed)) {
                        counts[prov.name]++;
                        matched = true;
                        break; // 匹配到一个省份即跳出
                    }
                }

                // 规则 3：若无法匹配到任何已知省份，自动忽略该行（静默过滤非地名干扰行）
            });

            return Object.keys(counts).map(provName => ({
                name: provName,
                value: counts[provName]
            }));
        }

        // 渲染地图
        function renderMap(data) {
            const maxVal = Math.max(...data.map(item => item.value), 5);
            const selectedColorKey = document.getElementById('colorScheme').value;

            // 针对移动端屏幕做尺寸适配
            const isMobile = window.innerWidth <= 600;

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}<br/>机构数量：<strong>{c}</strong> 家',
                    confine: true // 限制 Tooltip 在图表容器内，防止移动端超出屏幕
                },
                visualMap: {
                    min: 0,
                    max: maxVal,
                    left: isMobile ? '5%' : '10%',
                    bottom: isMobile ? '5%' : '8%',
                    text: ['高', '低'],
                    calculable: true,
                    itemWidth: isMobile ? 12 : 15,
                    itemHeight: isMobile ? 80 : 120,
                    textStyle: {
                        fontSize: isMobile ? 10 : 12
                    },
                    inRange: {
                        color: colorPalette[selectedColorKey]
                    }
                },
                series: [
                    {
                        name: '机构数量',
                        type: 'map',
                        map: 'china',
                        roam: true, // 允许手势缩放和平移
                        zoom: 1.2,  // 初始缩放比例
                        label: {
                            show: !isMobile, // 移动端默认隐藏名称标签，避免文字重叠挤压
                            fontSize: 10,
                            color: '#333'
                        },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 12,
                                fontWeight: 'bold'
                            },
                            itemStyle: {
                                areaColor: '#fde047' // 触摸高亮颜色
                            }
                        },
                        data: data
                    }
                ]
            };

            myChart.setOption(option, true);
        }

        // 启动应用
        start();
    </script>
</body>
</html>
