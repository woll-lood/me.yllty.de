<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全国机构分布热力图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        /* 顶部控制栏 */
        header {
            background: #ffffff;
            padding: 10px 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }
        h1 { font-size: 15px; font-weight: 600; color: #1f2937; }
        .controls { display: flex; align-items: center; gap: 8px; }
        label { font-size: 12px; color: #6b7280; display: inline-flex; align-items: center; gap: 3px; }
        select {
            padding: 4px 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #f9fafb;
            font-size: 12px;
            outline: none;
        }

        /* 蓝色群宣传通知栏 */
        .group-notice-bar {
            background: #e6f7ff;
            border-bottom: 1px solid #91d5ff;
            padding: 8px 32px 8px 12px;
            font-size: 12px;
            color: #096dd9;
            text-align: center;
            position: relative;
            z-index: 9;
            flex-shrink: 0;
        }
        .group-notice-bar a {
            color: #096dd9;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }

        /* 统一声明栏 */
        .notice-bar {
            background: #fffbe6;
            border-bottom: 1px solid #ffe58f;
            padding: 8px 32px 8px 14px;
            font-size: 12px;
            color: #d48806;
            line-height: 1.6;
            text-align: left;
            position: relative;
            z-index: 9;
            flex-shrink: 0;
        }

        /* 关闭按钮标准样式 */
        .close-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
            opacity: 0.6;
        }
        .close-btn:hover {
            opacity: 1;
        }

        /* 地图主容器 - 确保自适应拉伸铺满 */
        #map-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: none;
        }

        /* 加载中与错误提示遮罩 */
        #loading-mask {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 20;
            font-size: 14px;
            color: #4b5563;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 错误详细信息盒 */
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            text-align: left;
            margin-top: 12px;
            max-width: 90%;
            word-break: break-all;
            line-height: 1.6;
        }

        /* 底部可拖拽抽屉式卡片 */
        .rank-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
            z-index: 15;
            display: flex;
            flex-direction: column;
            max-height: 50vh;
            touch-action: none;
            transition: transform 0.25s ease-out;
        }

        /* 扩大的可拖拽区域（包含小横条和整个头部栏） */
        .drag-area {
            width: 100%;
            cursor: grab;
            user-select: none;
            border-bottom: 1px solid #f1f5f9;
        }

        .drag-handle-wrapper {
            width: 100%;
            padding: 8px 0 2px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .drag-handle {
            width: 36px;
            height: 4px;
            background-color: #cbd5e1;
            border-radius: 2px;
        }

        .rank-header {
            padding: 4px 14px 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rank-title {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            white-space: nowrap;
        }

        .rank-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rank-controls label {
            font-size: 12px;
            color: #6b7280;
        }

        .rank-body {
            overflow-y: auto;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            touch-action: pan-y;
        }

        /* 排名条目列表 */
        .rank-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            gap: 10px;
        }

        .rank-num {
            width: 20px;
            font-weight: bold;
            color: #9ca3af;
            text-align: right;
        }

        .rank-num.top3 {
            color: #ef4444;
        }

        .rank-name {
            width: 48px;
            font-weight: 500;
            color: #1f2937;
            white-space: nowrap;
        }

        .rank-bar-wrapper {
            flex: 1;
            background: #f3f4f6;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            position: relative;
        }

        .rank-bar-inner {
            height: 100%;
            background: #3b82f6;
            border-radius: 7px;
            transition: width 0.4s ease, background-color 0.3s ease;
        }

        .rank-value {
            width: 85px;
            text-align: right;
            font-size: 11px;
            color: #4b5563;
            white-space: nowrap;
        }

        /* 底部版权信息栏 */
        footer {
            background-color: #f8fafc;
            border-top: 1px solid #f1f5f9;
            padding: 8px 12px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            user-select: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>机构分布热力图</h1>
        <div class="controls">
            <label for="colorScheme">配色：</label>
            <select id="colorScheme">
                <option value="red">暖红</option>
                <option value="blue">深蓝</option>
                <option value="green">墨绿</option>
                <option value="purple">紫色</option>
            </select>
            <label for="mapMetric">依据：</label>
            <select id="mapMetric">
                <option value="total" selected>总数</option>
                <option value="active">现存数</option>
                <option value="cancelled">注销数</option>
                <option value="cancelRate">注销率</option>
            </select>
        </div>
    </header>

    <div class="group-notice-bar" id="groupNoticeBar">
        欢迎加入忆兰反网戒群：<a href="mqqapi://card/show_pslcard?src_type=internal&version=1&uin=1075965802&card_type=group&source=qrcode" target="_blank" onclick="copyGroupNum('1075965802')">1075965802</a>
        <button class="close-btn" style="color: #096dd9;" onclick="closeNotice('groupNoticeBar')" title="关闭">✕</button>
    </div>

    <div class="notice-bar" id="noticeBar">
        <strong>声明：</strong>统计不完全，数据未经完全证实，请注意甄别；<br>
        港澳台区域暂无对应统计数据，地图矢量边界完整保留；<br>
        地图矢量来源：Apache ECharts 开源 china.json 矢量文件。
        <button class="close-btn" style="color: #d48806;" onclick="closeNotice('noticeBar')" title="关闭">✕</button>
    </div>

    <div id="map-container">
        <div id="loading-mask">
            <div class="spinner" id="spinner"></div>
            <div id="loading-text">正在分析数据并加载地图...</div>
            <div id="error-detail" style="display: none;" class="error-box"></div>
        </div>
    </div>

    <div class="rank-panel" id="rankPanel">
        <div class="drag-area" id="dragArea">
            <div class="drag-handle-wrapper">
                <div class="drag-handle"></div>
            </div>
            <div class="rank-header">
                <div class="rank-title">各省机构数据排名</div>
                <div class="rank-controls">
                    <label for="rankSortField">指标：</label>
                    <select id="rankSortField">
                        <option value="total" selected>总数</option>
                        <option value="active">现存数</option>
                        <option value="cancelled">注销数</option>
                        <option value="cancelRate">注销率</option>
                    </select>
                    <select id="rankSortOrder">
                        <option value="desc">降序</option>
                        <option value="asc">升序</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="rank-body" id="rankList">
        </div>
        <footer>
            Copyright © 2026 yl_lty. All rights reserved.
        </footer>
    </div>

    <script>
        const DATA_URL = 'https://me.yllty.de/school-map/schools.txt';

        // 复制群号函数
        function copyGroupNum(groupNum) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(groupNum);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = groupNum;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error('复制失败', err);
                }
                document.body.removeChild(textarea);
            }
        }

        // 关闭通知栏并使地图自适应刷新
        function closeNotice(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                setTimeout(() => { if (myChart) myChart.resize(); }, 50);
            }
        }

        const provinceMap = [
            { name: "北京", pattern: /^北京/ }, { name: "天津", pattern: /^天津/ },
            { name: "上海", pattern: /^上海/ }, { name: "重庆", pattern: /^重庆/ },
            { name: "河北", pattern: /^河北/ }, { name: "山西", pattern: /^山西/ },
            { name: "辽宁", pattern: /^辽宁/ }, { name: "吉林", pattern: /^吉林/ },
            { name: "黑龙江", pattern: /^黑龙江/ }, { name: "江苏", pattern: /^江苏/ },
            { name: "浙江", pattern: /^浙江/ }, { name: "安徽", pattern: /^安徽/ },
            { name: "福建", pattern: /^福建/ }, { name: "江西", pattern: /^江西/ },
            { name: "山东", pattern: /^山东/ }, { name: "河南", pattern: /^河南/ },
            { name: "湖北", pattern: /^湖北/ }, { name: "湖南", pattern: /^湖南/ },
            { name: "广东", pattern: /^广东/ }, { name: "海南", pattern: /^海南/ },
            { name: "四川", pattern: /^四川/ }, { name: "贵州", pattern: /^贵州/ },
            { name: "云南", pattern: /^云南/ }, { name: "陕西", pattern: /^陕西/ },
            { name: "甘肃", pattern: /^甘肃/ }, { name: "青海", pattern: /^青海/ },
            { name: "台湾", pattern: /^台湾/ }, { name: "内蒙古", pattern: /^内蒙古/ },
            { name: "广西", pattern: /^广西/ }, { name: "西藏", pattern: /^西藏/ },
            { name: "宁夏", pattern: /^宁夏/ }, { name: "新疆", pattern: /^新疆/ },
            { name: "香港", pattern: /^香港/ }, { name: "澳门", pattern: /^澳门/ }
        ];

        const colorPalette = {
            red: ['#fef2f2', '#fca5a5', '#ef4444', '#b91c1c', '#7f1d1d'],
            blue: ['#eff6ff', '#93c5fd', '#3b82f6', '#1d4ed8', '#1e3a8a'],
            green: ['#f0fdf4', '#86efac', '#22c55e', '#15803d', '#14532d'],
            purple: ['#faf5ff', '#d8b4fe', '#a855f7', '#6b21a8', '#3b0764']
        };

        const mapContainer = document.getElementById('map-container');
        const loadingMask = document.getElementById('loading-mask');
        const loadingText = document.getElementById('loading-text');
        const errorDetail = document.getElementById('error-detail');
        const spinner = document.getElementById('spinner');

        let myChart = null;
        let cachedParsedData = null;

        function fetchWithTimeout(url, options = {}, timeout = 8000) {
            return Promise.race([
                fetch(url, options),
                new Promise((_, reject) => setTimeout(() => reject(new Error('网络请求超时，请检查您的移动网络状态')), timeout))
            ]);
        }

        async function start() {
            try {
                myChart = echarts.init(mapContainer, null, {
                    touchResponseSensitivity: 0.3
                });
                window.addEventListener('resize', () => myChart.resize());

                const [geoJson, textData] = await Promise.all([
                    fetchChinaGeoJson(),
                    fetchTxtData()
                ]);

                echarts.registerMap('china', geoJson);
                cachedParsedData = parseTextData(textData);

                renderMap(cachedParsedData);
                renderRankList(cachedParsedData);
                loadingMask.style.display = 'none';

            } catch (error) {
                spinner.style.display = 'none';
                loadingText.style.color = '#dc2626';
                loadingText.innerHTML = `<strong>无法加载数据或地图</strong>`;
                errorDetail.style.display = 'block';
                errorDetail.innerHTML = `
                    <strong>错误原因：</strong>${error.message}<br><br>
                    <strong>建议解决方案：</strong><br>
                    1. 如果是 TXT 请求被阻断，请确认服务端 <code>me.yllty.de</code> 已允许跨域（CORS）。<br>
                    2. 请刷新页面重试或检查手机网络连接。
                `;
            }
        }

        async function fetchChinaGeoJson() {
            const urls = [
                'https://registry.npmmirror.com/echarts/4.0.4/files/map/json/china.json'
            ];

            for (let url of urls) {
                try {
                    const res = await fetchWithTimeout(url, {}, 8000);
                    if (res.ok) return await res.json();
                } catch (e) {
                    console.warn(`GeoJSON 节点尝试失败: ${url}`);
                }
            }
            throw new Error('地图底图（GeoJSON）节点连接失败');
        }

        async function fetchTxtData() {
            try {
                const res = await fetchWithTimeout(DATA_URL, {}, 8000);
                if (!res.ok) throw new Error(`数据请求返回异常代码（HTTP ${res.status}）`);
                return await res.text();
            } catch (e) {
                throw new Error(`获取机构列表失败 (${e.message})`);
            }
        }

        function parseTextData(text) {
            const counts = {};
            provinceMap.forEach(item => {
                counts[item.name] = { total: 0, cancelled: 0, active: 0 };
            });

            const lines = text.split(/\r?\n/);
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                for (let prov of provinceMap) {
                    if (prov.pattern.test(trimmed)) {
                        counts[prov.name].total++;
                        if (trimmed.includes('注销') || trimmed.includes('关闭')) {
                            counts[prov.name].cancelled++;
                        } else {
                            counts[prov.name].active++;
                        }
                        break;
                    }
                }
            });

            return counts;
        }

        function renderMap(countsData) {
            const selectedMetric = document.getElementById('mapMetric').value;
            const selectedColorKey = document.getElementById('colorScheme').value;
            const isMobile = window.innerWidth <= 600;

            const seriesData = Object.keys(countsData).map(provName => {
                const item = countsData[provName];
                const cancelRateNum = item.total > 0 ? (item.cancelled / item.total) * 100 : 0;
                
                let val = item.total;
                if (selectedMetric === 'active') val = item.active;
                else if (selectedMetric === 'cancelled') val = item.cancelled;
                else if (selectedMetric === 'cancelRate') val = Number(cancelRateNum.toFixed(1));

                return {
                    name: provName,
                    value: val,
                    total: item.total,
                    cancelled: item.cancelled,
                    active: item.active,
                    cancelRate: cancelRateNum.toFixed(1)
                };
            });

            const maxVal = Math.max(...seriesData.map(item => item.value), selectedMetric === 'cancelRate' ? 10 : 5);

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (!params.data) {
                            return `<strong>${params.name}</strong><br/>暂无统计数据`;
                        }
                        const { total = 0, cancelled = 0, active = 0, cancelRate = '0.0' } = params.data;
                        return `
                            <strong>${params.name}</strong><br/>
                            总数：<strong>${total}</strong> 家<br/>
                            现存数：<strong>${active}</strong> 家<br/>
                            注销数：<strong>${cancelled}</strong> 家<br/>
                            注销率：<strong>${cancelRate}%</strong>
                        `;
                    },
                    confine: true
                },
                visualMap: {
                    min: 0,
                    max: maxVal,
                    left: '5%',
                    bottom: '8%',
                    text: selectedMetric === 'cancelRate' ? ['高 (%)', '低 (%)'] : ['高', '低'],
                    calculable: true,
                    itemWidth: 12,
                    itemHeight: 90,
                    inRange: { color: colorPalette[selectedColorKey] }
                },
                series: [{
                    name: '机构分布',
                    type: 'map',
                    map: 'china',
                    roam: true,
                    zoom: 1.1,
                    scaleLimit: {
                        min: 1,
                        max: 2.5
                    },
                    label: { show: !isMobile, fontSize: 10 },
                    emphasis: {
                        label: { show: true, fontSize: 12 },
                        itemStyle: { areaColor: '#fde047' }
                    },
                    data: seriesData
                }]
            };

            myChart.setOption(option, true);
        }

        /* 渲染排名列表 */
        function renderRankList(countsData) {
            const field = document.getElementById('rankSortField').value;
            const sortOrder = document.getElementById('rankSortOrder').value;
            const colorKey = document.getElementById('colorScheme').value;

            let nationalTotal = 0;
            const list = Object.keys(countsData).map(name => {
                const item = countsData[name];
                nationalTotal += item.total;
                
                const cancelRate = item.total > 0 ? (item.cancelled / item.total) * 100 : 0;
                let val = item[field];
                if (field === 'cancelRate') {
                    val = cancelRate;
                }

                return {
                    name,
                    total: item.total,
                    active: item.active,
                    cancelled: item.cancelled,
                    cancelRate,
                    value: val
                };
            });

            // 排序
            list.sort((a, b) => {
                return sortOrder === 'desc' ? b.value - a.value : a.value - b.value;
            });

            const rankListEl = document.getElementById('rankList');
            const themeColor = colorPalette[colorKey][2];

            rankListEl.innerHTML = list.map((item, index) => {
                const percent = nationalTotal > 0 ? ((item.total / nationalTotal) * 100).toFixed(1) : 0;
                const displayNum = index + 1;

                let valueDisplay = '';
                let barWidthPercent = percent;

                if (field === 'cancelRate') {
                    valueDisplay = `${item.cancelRate.toFixed(1)}% <span style="color:#9ca3af; font-size:10px;">(${item.cancelled}/${item.total})</span>`;
                    barWidthPercent = item.cancelRate.toFixed(1);
                } else {
                    valueDisplay = `${item.value} 家 <span style="color:#9ca3af; font-size:10px;">(${percent}%)</span>`;
                    barWidthPercent = percent;
                }

                return `
                    <div class="rank-item">
                        <div class="rank-num ${displayNum <= 3 ? 'top3' : ''}">${displayNum}</div>
                        <div class="rank-name">${item.name}</div>
                        <div class="rank-bar-wrapper">
                            <div class="rank-bar-inner" style="width: ${barWidthPercent}%; background-color: ${themeColor}"></div>
                        </div>
                        <div class="rank-value">
                            ${valueDisplay}
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* 拖拽与折叠手势处理 */
        const rankPanel = document.getElementById('rankPanel');
        const dragArea = document.getElementById('dragArea');

        let isCollapsed = false;
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        function getCollapsedY() {
            return rankPanel.offsetHeight - dragArea.offsetHeight;
        }

        function setPanelTranslate(translateY, animate = false) {
            rankPanel.style.transition = animate ? 'transform 0.25s ease-out' : 'none';
            rankPanel.style.transform = `translateY(${translateY}px)`;
        }

        function togglePanel() {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                setPanelTranslate(getCollapsedY(), true);
            } else {
                setPanelTranslate(0, true);
            }
            setTimeout(() => { if (myChart) myChart.resize(); }, 300);
        }

        dragArea.addEventListener('click', (e) => {
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION' || e.target.tagName === 'LABEL') {
                return;
            }
            if (!isDragging) togglePanel();
        });

        dragArea.addEventListener('touchstart', (e) => {
            if (e.target.tagName === 'SELECT') return;
            startY = e.touches[0].clientY;
            isDragging = false;
        }, { passive: true });

        dragArea.addEventListener('touchmove', (e) => {
            if (e.target.tagName === 'SELECT') return;
            currentY = e.touches[0].clientY;
            const diffY = currentY - startY;
            if (Math.abs(diffY) > 5) isDragging = true;

            let baseTranslate = isCollapsed ? getCollapsedY() : 0;
            let targetY = baseTranslate + diffY;
            
            if (targetY < -20) targetY = -20;
            if (targetY > getCollapsedY() + 20) targetY = getCollapsedY() + 20;

            setPanelTranslate(targetY, false);
        }, { passive: true });

        dragArea.addEventListener('touchend', (e) => {
            if (e.target.tagName === 'SELECT') return;
            if (!isDragging) return;
            const diffY = currentY - startY;
            if (diffY > 40) {
                isCollapsed = true;
                setPanelTranslate(getCollapsedY(), true);
            } else if (diffY < -40) {
                isCollapsed = false;
                setPanelTranslate(0, true);
            } else {
                setPanelTranslate(isCollapsed ? getCollapsedY() : 0, true);
            }
            setTimeout(() => { if (myChart) myChart.resize(); }, 300);
        });

        let isMouseDown = false;
        dragArea.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'SELECT') return;
            isMouseDown = true;
            startY = e.clientY;
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            currentY = e.clientY;
            const diffY = currentY - startY;
            if (Math.abs(diffY) > 5) isDragging = true;

            let baseTranslate = isCollapsed ? getCollapsedY() : 0;
            let targetY = baseTranslate + diffY;
            if (targetY < -20) targetY = -20;
            if (targetY > getCollapsedY() + 20) targetY = getCollapsedY() + 20;

            setPanelTranslate(targetY, false);
        });

        window.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            if (!isDragging) return;
            const diffY = currentY - startY;
            if (diffY > 40) {
                isCollapsed = true;
                setPanelTranslate(getCollapsedY(), true);
            } else if (diffY < -40) {
                isCollapsed = false;
                setPanelTranslate(0, true);
            } else {
                setPanelTranslate(isCollapsed ? getCollapsedY() : 0, true);
            }
            setTimeout(() => { if (myChart) myChart.resize(); }, 300);
        });

        // 绑定筛选事件
        document.getElementById('colorScheme').addEventListener('change', () => {
            if (cachedParsedData) {
                renderMap(cachedParsedData);
                renderRankList(cachedParsedData);
            }
        });

        // 地图指标单独变动
        document.getElementById('mapMetric').addEventListener('change', () => {
            if (cachedParsedData) {
                renderMap(cachedParsedData);
            }
        });

        // 排名面板指标单独变动
        document.getElementById('rankSortField').addEventListener('change', () => {
            if (cachedParsedData) renderRankList(cachedParsedData);
        });

        document.getElementById('rankSortOrder').addEventListener('change', () => {
            if (cachedParsedData) renderRankList(cachedParsedData);
        });

        start();
    </script>
</body>
</html>
